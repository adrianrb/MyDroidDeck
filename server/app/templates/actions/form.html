{% extends "base.html" %}
{% block content %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/admin/actions">
    <label>
        {{ t("admin.action") }}
        <input type="text" name="action" required placeholder="obs.scene.iniciar">
    </label>
    <p class="muted">{{ t("admin.action_hint") }}</p>
    <label>
        {{ t("admin.executable") }}
        <input type="text" name="executable" required
               placeholder="C:\Program Files\OBS Studio\bin\64bit\obs64.exe">
    </label>
    <p class="muted">{{ t("admin.executable_hint") }}</p>
    <label>
        {{ t("admin.args") }}
        <input type="text" name="args" placeholder="--scene Cena">
    </label>
    <button type="submit">{{ t("admin.save") }}</button>
</form>
{% endblock %}
