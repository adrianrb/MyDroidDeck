<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t("admin.title") }}</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    <header>
        <h1>{{ t("admin.title") }}</h1>
    </header>
    {% block nav %}
    <nav class="toolbar">
        <a class="button" href="/admin/profiles">{{ t("admin.profiles") }}</a>
        <a class="button" href="/admin/actions">{{ t("admin.actions") }}</a>
        <a class="button" href="/admin/devices">{{ t("admin.devices") }}</a>
        <form method="post" action="/admin/logout" class="logout">
            <button type="submit">{{ t("admin.logout") }}</button>
        </form>
    </nav>
    {% endblock %}
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
